A.recibo = () => toast('Recibo enviado ao cliente no WhatsApp.', { icon: 'receipt' });

/* pagamento na entrega */
function pagamento(r) {
  const f = { forma: r.plano ? 'Plano' : 'Pix', desc: 0, lav: r.lavador || '', aval: true };
  drawer(() => {
    const total = Math.max(0, r.valor - f.desc);
    return {
      title: 'Receber', sub: `${esc(r.modelo)} · ${r.placa} · ${esc(r.nome)}`,
      body: `<div class="card"><div class="list"><div class="li"><div class="tx"><b>${esc(servNome(r.serv))}</b><small>${porteN(r.porte)}</small></div><span class="num">${r.plano ? '<span class="tag">plano</span>' : brl(r.base)}</span></div>
        ${r.adds.map(a => `<div class="li"><div class="tx"><b>${esc(addOn(a)?.nome || '')}</b></div><span class="num">${brl(addOn(a)?.preco || 0)}</span></div>`).join('')}
        ${r.taxa ? `<div class="li"><div class="tx"><b>Deslocamento</b><small>${esc(regN(r.reg))}</small></div><span class="num">${brl(r.taxa)}</span></div>` : ''}
        ${f.desc ? `<div class="li"><div class="tx"><b>Desconto</b></div><span class="num" style="color:var(--ok)">− ${brl(f.desc)}</span></div>` : ''}
        <div class="li" style="background:var(--panel2)"><div class="tx"><b>Total</b></div><span class="num" style="font-weight:650;font-size:18px">${brl(total)}</span></div></div></div>
        <div class="fld"><label>Forma de pagamento</label><div class="chips">${FORMAS.filter(x => x !== 'Plano' || r.plano).map(x => `<button class="chip ${f.forma === x ? 'on' : ''}" data-a="pgForma" data-k="${x}">${x}</button>`).join('')}</div></div>
        <div class="grid2"><div class="fld"><label for="pg-d">Desconto (R$)</label><input class="in num" id="pg-d" data-ch="pgDesc" value="${f.desc ? n1(f.desc) : ''}" placeholder="0,00" inputmode="decimal"></div>
        <div class="fld"><label for="pg-l">Quem lavou</label><select class="in" id="pg-l" data-ch="pgLav"><option value="">Escolha</option>${DB.equipe.map(e => `<option value="${e.id}" ${f.lav === e.id ? 'selected' : ''}>${esc(e.nome)}</option>`).join('')}</select><span class="hint">Entra na comissão do dia</span></div></div>
        <button class="opt sq ${f.aval ? 'on' : ''}" data-a="pgAval"><span class="rd"></span><span><b>Pedir avaliação no WhatsApp</b><small>Uma hora depois do atendimento, com o link da avaliação no Google</small></span></button>
        ${(() => { const c = cliById(r.cli); if (!c) return ''; const s = statsCli(c); const prox = (s.visitas + 1) % DB.cfg.fidelidade; return `<div class="note t">${ic('gift', 's')}<span>${prox === 0 ? `<b>Esta é a ${DB.cfg.fidelidade}ª lavagem de ${esc(c.nome.split(' ')[0])}.</b> A próxima lavagem simples sai de graça.` : `Cartão fidelidade de ${esc(c.nome.split(' ')[0])}: ${prox} de ${DB.cfg.fidelidade} com esta lavagem.`}</span></div>`; })()}`,
      foot: `<button class="btn g" data-a="closeDrawer">Voltar</button><button class="btn p" data-a="pgOk">${ic('check', 's')}Recebi ${brl(total)}</button>`,
    };
  });
  A.pgForma = el => { f.forma = el.dataset.k; redrawDrawer(); };
  IN.pgDesc = el => { f.desc = Math.max(0, parseFloat((el.value || '0').replace(/\./g, '').replace(',', '.')) || 0); redrawDrawer(); };
  IN.pgLav = el => { f.lav = el.value; };
  A.pgAval = () => { f.aval = !f.aval; redrawDrawer(); };
  A.pgOk = () => {
    const prev = { st: r.st, pago: r.pago, valor: r.valor, lavador: r.lavador };
    r.st = 'entregue'; r.valor = Math.max(0, r.valor - f.desc); r.pago = { forma: f.forma, hora: fromMin(NOWMIN), desc: f.desc }; r.lavador = f.lav || r.lavador || 'jef';
    save(); closeDrawer(); rerender();
    toast(`${r.placa} concluído · ${brl(r.valor)} no ${f.forma}${f.aval ? '. Pedido de avaliação agendado.' : ''}`, { undo: () => { Object.assign(r, prev); save(); rerender(); }, ms: 5500 });
  };
}


/* ============ NOVA RESERVA / REMARCAR (pelo painel) ============ */
function novaReserva(pre = {}) {
  closePop();
  const ed = pre.edit || null; const c0 = ed ? cliById(ed.cli) : pre.cli ? cliById(pre.cli) : null;
  const f = {
    cli: c0 ? c0.id : '', nome: '', tel: '', veic: c0 ? 0 : -1, placa: '', modelo: '', porte: ed ? ed.porte : c0 ? c0.veics[0].porte : 'p',
    serv: ed ? ed.serv : 'completa', adds: new Set(ed ? ed.adds : []), data: ed ? ed.data : pre.data || TODAY, ini: ed ? ed.ini : pre.ini || '', box: ed ? ed.box : pre.box ?? null,
    origem: ed ? ed.origem : 'whatsapp', obs: ed ? ed.obs : '',
    reg: ed ? ed.reg : c0 ? c0.reg : DB.cfg.regioes[0]?.id, end: ed ? ed.end || '' : c0 ? c0.end || '' : '', local: ed ? ed.local || 'casa' : c0 ? c0.local || 'casa' : 'casa', agua: ed ? ed.agua !== false : c0 ? c0.agua !== false : true,
  };
  if (ed) { const i = c0 ? c0.veics.findIndex(v => v.placa === ed.placa) : -1; f.veic = i; if (i < 0) { f.placa = ed.placa; f.modelo = ed.modelo; } }
  const porteAtual = () => { const c = cliById(f.cli); return c && f.veic >= 0 ? c.veics[f.veic].porte : f.porte; };
  drawer(() => {
    const c = cliById(f.cli); const porte = porteAtual();
    if (precoDe(f.serv, porte) == null) f.serv = DB.servicos.find(s => precoDe(s.id, porte) != null)?.id;
    const pl = c ? planoAplica(c.id, f.serv, f.data, ed && ed.id) : null;
    const o = orcamento({ serv: f.serv, porte, adds: [...f.adds], reg: f.reg, plano: !!pl });
    const sl = slotsDe(f.data, o.dur, ed && ed.id).filter(x => x.ok || x.t === f.ini);
    if (f.ini && !sl.some(x => x.t === f.ini && x.ok)) { /* horário pedido ocupado */ }
    const cur = sl.find(x => x.t === f.ini); const livres = cur ? cur.boxes : [];
    if (f.box == null || !livres.includes(f.box)) f.box = livres[0] ?? null;
    const okHora = !!(cur && cur.ok && f.box != null);
    const h = horasDe(f.data);
    return {
      title: ed ? 'Remarcar reserva' : 'Nova reserva', sub: ed ? `${ed.cod} · ${esc(ed.nome)}` : 'Para quem liga, chama no WhatsApp ou no Instagram.',
      body: `<div class="fld"><label for="nr-c">Cliente</label><select class="in" id="nr-c" data-ch="nrCli" ${ed ? 'disabled' : ''}><option value="">+ Cliente novo</option>${DB.clientes.slice().sort((a, b) => a.nome.localeCompare(b.nome)).map(x => `<option value="${x.id}" ${f.cli === x.id ? 'selected' : ''}>${esc(x.nome)} · ${x.veics.map(v => v.placa).join(', ')}</option>`).join('')}</select></div>
        ${!c ? `<div class="grid2"><div class="fld"><label for="nr-n">Nome</label><input class="in" id="nr-n" data-i="nrNome" value="${esc(f.nome)}" placeholder="Nome do cliente"></div><div class="fld"><label for="nr-t">WhatsApp</label><input class="in" id="nr-t" data-i="nrTel" value="${esc(f.tel)}" placeholder="(11) 9 0000-0000" inputmode="tel"></div></div>` : ''}
        ${c ? `<div class="fld"><label>Veículo</label><div class="chips">${c.veics.map((v, i) => `<button class="chip ${f.veic === i ? 'on' : ''}" data-a="nrVeic" data-k="${i}">${esc(v.modelo)} · ${v.placa}</button>`).join('')}<button class="chip ${f.veic === -1 ? 'on' : ''}" data-a="nrVeic" data-k="-1">${ic('plus', 'xs')}Outro</button></div></div>` : ''}
        ${!c || f.veic === -1 ? `<div class="grid2"><div class="fld"><label for="nr-p">Placa</label><input class="in mono" id="nr-p" data-i="nrPlaca" value="${esc(f.placa)}" placeholder="ABC1D23" maxlength="8" style="text-transform:uppercase"></div><div class="fld"><label for="nr-m">Modelo e cor</label><input class="in" id="nr-m" data-i="nrModelo" value="${esc(f.modelo)}" placeholder="Ex.: Onix prata"></div></div>
          <div class="fld"><label>Porte</label><div class="chips">${PORTES.map(p => `<button class="chip ${f.porte === p.id ? 'on' : ''}" data-a="nrPorte" data-k="${p.id}">${p.nome}</button>`).join('')}</div></div>` : ''}
        <div class="fld"><label>Serviço</label><div class="stack" style="gap:6px">${DB.servicos.filter(s => precoDe(s.id, porte) != null).map(s => `<button class="opt ${f.serv === s.id ? 'on' : ''}" data-a="nrServ" data-k="${s.id}"><span class="rd"></span><span><b>${esc(s.nome)}</b><small>${durDe(s.id, porte)} min${s.online ? '' : ' · só pelo painel'}</small></span><span class="pr">${brl(precoDe(s.id, porte))}</span></button>`).join('')}</div></div>
        <div class="fld"><label>Adicionais</label><div class="chips">${DB.adicionais.map(a => `<button class="chip ${f.adds.has(a.id) ? 'on' : ''}" data-a="nrAdd" data-k="${a.id}">${esc(a.nome)} <span class="n">+${brl0(a.preco)}</span></button>`).join('')}</div></div>
        <div class="grid2"><div class="fld"><label for="nr-d">Dia</label><input class="in" type="date" id="nr-d" data-ch="nrData" value="${f.data}" min="${TODAY}"></div>
        <div class="fld"><label for="nr-h">Horário</label><select class="in" id="nr-h" data-ch="nrIni"><option value="">${h ? (sl.some(x => x.ok) ? 'Escolha' : 'Dia lotado') : 'Fechado neste dia'}</option>${sl.map(x => `<option value="${x.t}" ${x.t === f.ini ? 'selected' : ''} ${x.ok ? '' : 'disabled'}>${x.t}${x.ok ? ` · ${plural(x.boxes.length, 'equipe livre', 'equipes livres')}` : ' · ocupado'}</option>`).join('')}</select></div></div>
        ${livres.length > 1 ? `<div class="fld"><label>Equipe</label><div class="chips">${livres.map(b => `<button class="chip ${f.box === b ? 'on' : ''}" data-a="nrBox" data-k="${b}">${boxN(b)}</button>`).join('')}</div></div>` : ''}
        <div class="fld"><label>Como chegou</label><div class="chips">${Object.entries(ORIGEM).filter(([k]) => k !== 'online' || f.origem === 'online').map(([k, [l, i]]) => `<button class="chip ${f.origem === k ? 'on' : ''}" data-a="nrOrig" data-k="${k}">${ic(i, 'xs')}${l}</button>`).join('')}</div></div>
        <div class="grid2"><div class="fld"><label for="nr-r">Região</label><select class="in" id="nr-r" data-ch="nrReg">${DB.cfg.regioes.map(x => `<option value="${x.id}" ${f.reg === x.id ? 'selected' : ''}>${esc(x.nome)}${x.taxa ? ` · + ${brl(x.taxa)}` : ' · sem taxa'}</option>`).join('')}</select></div>
        <div class="fld"><label for="nr-e">Endereço</label><input class="in" id="nr-e" data-i="nrEnd" value="${esc(f.end)}" placeholder="Rua, número e complemento"></div></div>
        <div class="fld"><label>Onde o carro fica</label><div class="chips">${Object.entries(LOCAIS).map(([k, [l, , i]]) => `<button class="chip ${f.local === k ? 'on' : ''}" data-a="nrLocal" data-k="${k}">${ic(i, 'xs')}${l}</button>`).join('')}<button class="chip ${f.agua ? 'on' : ''}" data-a="nrAgua">${ic('droplets', 'xs')}Tem ponto de água</button></div></div>
        <div class="fld"><label for="nr-o">Observação <span class="faint">(opcional)</span></label><input class="in" id="nr-o" data-i="nrObs" value="${esc(f.obs)}" placeholder="Ex.: muito pelo de cachorro no banco de trás"></div>
        ${pl ? `<div class="note t">${ic('repeat', 's')}<span><b>Incluso no ${esc(pl.p.nome)}.</b> ${pl.p.qtd ? `${pl.usadas} de ${pl.p.qtd} usadas neste mês.` : 'Plano ilimitado.'}</span></div>` : ''}
        ${f.ini && okHora ? `<div class="note ok">${ic('ccheck', 's')}<span><b>${brl(o.total)} · ${o.dur} min.</b> ${boxN(f.box)}, ${dataCurta(f.data)} das ${f.ini} às ${fromMin(toMin(f.ini) + o.dur)}${o.tx ? `, com ${brl(o.tx)} de deslocamento` : ''}.</span></div>` : `<div class="note">${ic('clock', 's')}<span>${brl(o.total)} · ${o.dur} min. Escolha o horário.</span></div>`}`,
      foot: `<button class="btn g" data-a="closeDrawer">Cancelar</button><button class="btn p" data-a="nrSave" ${okHora ? '' : 'disabled'}>${ed ? 'Salvar e avisar o cliente' : 'Reservar'}</button>`,
    };
  });
  IN.nrCli = el => { f.cli = el.value; f.veic = f.cli ? 0 : -1; const c = cliById(f.cli); if (c) Object.assign(f, { reg: c.reg || f.reg, end: c.end || '', local: c.local || 'casa', agua: c.agua !== false }); redrawDrawer(); };
  IN.nrReg = el => { f.reg = el.value; redrawDrawer(); }; IN.nrEnd = el => { f.end = el.value; };
  A.nrLocal = el => { f.local = el.dataset.k; redrawDrawer(); }; A.nrAgua = () => { f.agua = !f.agua; redrawDrawer(); };
  IN.nrNome = el => { f.nome = el.value; }; IN.nrTel = el => { f.tel = el.value; }; IN.nrPlaca = el => { f.placa = fmtPlaca(el.value); }; IN.nrModelo = el => { f.modelo = el.value; }; IN.nrObs = el => { f.obs = el.value; };
  A.nrVeic = el => { f.veic = +el.dataset.k; redrawDrawer(); };
  A.nrPorte = el => { f.porte = el.dataset.k; redrawDrawer(); };
  A.nrServ = el => { f.serv = el.dataset.k; redrawDrawer(); };
  A.nrAdd = el => { const k = el.dataset.k; f.adds.has(k) ? f.adds.delete(k) : f.adds.add(k); redrawDrawer(); };
  IN.nrData = el => { f.data = el.value || TODAY; f.ini = ''; redrawDrawer(); };
  IN.nrIni = el => { f.ini = el.value; f.box = null; redrawDrawer(); };
  A.nrBox = el => { f.box = +el.dataset.k; redrawDrawer(); };
  A.nrOrig = el => { f.origem = el.dataset.k; redrawDrawer(); };
  A.nrSave = () => {
    if (f.end.trim().length < 5) { const e = $('#nr-e'); e.style.borderColor = 'var(--bad)'; e.focus(); return toast('Coloque o endereço do atendimento.', { icon: 'alert' }); }
    let c = cliById(f.cli);
    if (!c) {
      if (!f.nome.trim()) { $('#nr-n').style.borderColor = 'var(--bad)'; $('#nr-n').focus(); return toast('Escreva o nome do cliente.', { icon: 'alert' }); }
      if (!f.placa) { $('#nr-p').style.borderColor = 'var(--bad)'; $('#nr-p').focus(); return toast('Coloque a placa do veículo.', { icon: 'alert' }); }
      c = cliByTel(f.tel) || { id: 'c' + (UID++), nome: f.nome.trim(), tel: dig(f.tel), veics: [], obs: '', user: true, desde: TODAY };
      if (!DB.clientes.includes(c)) DB.clientes.push(c);
    }
    let v = f.veic >= 0 ? c.veics[f.veic] : null;
    if (!v) { if (!f.placa) { $('#nr-p').style.borderColor = 'var(--bad)'; return toast('Coloque a placa do veículo.', { icon: 'alert' }); } v = c.veics.find(x => x.placa === f.placa) || { placa: f.placa, modelo: f.modelo || 'Veículo', cor: '', porte: f.porte }; if (!c.veics.includes(v)) c.veics.push(v); }
    const pl = planoAplica(c.id, f.serv, f.data, ed && ed.id); const o = orcamento({ serv: f.serv, porte: v.porte, adds: [...f.adds], reg: f.reg, plano: !!pl });
    Object.assign(c, { reg: f.reg, end: f.end.trim(), local: f.local, agua: f.agua });
    const dados = { cli: c.id, nome: c.nome, tel: c.tel, placa: v.placa, modelo: v.modelo, porte: v.porte, serv: f.serv, adds: [...f.adds], data: f.data, ini: f.ini, dur: o.dur, box: f.box, base: o.base, valor: o.total, plano: !!pl, reg: f.reg, end: f.end.trim(), local: f.local, agua: f.agua, taxa: o.tx, origem: f.origem, obs: f.obs };
    if (ed) { const prev = { ...ed }; Object.assign(ed, dados); save(); closeDrawer(); rerender(); toast(`Reserva remarcada para ${dataCurta(f.data)} às ${f.ini}. Cliente avisado no WhatsApp.`, { undo: () => { Object.assign(ed, prev); save(); rerender(); } }); return; }
    const r = { id: 'r' + (UID++), cod: codigo(), ...dados, st: 'agendada', lavador: null, pago: null, criado: Date.now(), visto: true, user: true };
    DB.reservas.push(r); save(); closeDrawer(); S.agData = f.data; rerender();
    toast(`Reserva ${r.cod} · ${dataCurta(f.data)} às ${f.ini} com a ${boxN(f.box)}`, { icon: 'calcheck', undo: () => { DB.reservas.splice(DB.reservas.indexOf(r), 1); save(); rerender(); }, ms: 5000 });
  };
}
A.novaReserva = () => novaReserva();

      <div class="card"><div class="hd"><h3>Saídas</h3><span class="sp"></span><button class="btn sm" data-a="despNova">${ic('plus', 's')}Lançar</button></div><div class="list">${desp.map(x => `<div class="li"><span class="ic">${ic(x.cat === 'Produtos' ? 'droplets' : x.cat === 'Manutenção' ? 'wrench' : 'receipt', 's')}</span><div class="tx"><b>${esc(x.desc)}</b><small>${x.cat} · ${x.forma}</small></div><span class="num" style="font-weight:600;color:var(--bad)">− ${brl(x.valor)}</span></div>`).join('') || '<div class="empty" style="padding:20px"><b>Sem saídas neste dia</b></div>'}</div></div></div>
      <div class="stack"><div class="card"><div class="hd"><h3>Por forma de pagamento</h3></div><div>${porForma.map(([f, l]) => { const v = l.reduce((s, r) => s + r.valor, 0); return `<div class="hb" style="--c:${corF[f]}"><b>${f}</b><div class="bar"><i style="width:${v / maxF * 100}%"></i></div><span class="num">${brl(v)}</span></div>`; }).join('') || '<div class="empty" style="padding:20px">Nada recebido</div>'}</div></div>
      <div class="card"><div class="hd"><h3>Comissão da equipe</h3><span class="sub">sobre o preço de tabela</span></div><div class="list">${com.map(x => `<div class="li">${av(x.e.nome, 'sm')}<div class="tx"><b>${esc(x.e.nome)}</b><small>${plural(x.n, 'carro', 'carros')} · ${x.e.com}% de ${brl0(x.base)}</small></div><input class="in pin num" style="width:64px" data-ch="comPct" data-id="${x.e.id}" value="${x.e.com}" aria-label="Comissão de ${esc(x.e.nome)} em %"><span class="faint">%</span><span class="num" style="font-weight:600;min-width:80px;text-align:right">${brl(x.v)}</span></div>`).join('')}</div></div></div></div>`;

/* ============ RELATÓRIOS ============ */
VIEWS.relatorios = () => {
  const P = S.relP; const ini = iso(addDays(TODAY_D, -(P - 1)));
  const per = DB.reservas.filter(r => r.data >= ini && r.data <= TODAY);
  const feitas = per.filter(r => r.st === 'entregue'); const fat = feitas.reduce((s, r) => s + r.valor, 0);
  const falt = per.filter(r => r.st === 'faltou').length; const canc = per.filter(r => r.st === 'cancelada').length;
  const online = per.filter(r => r.origem === 'online').length;
  const dias = Array.from({ length: P }, (_, i) => iso(addDays(TODAY_D, -(P - 1) + i)));
  const porDia = dias.map(d => feitas.filter(r => r.data === d).reduce((s, r) => s + r.valor, 0));
  const W = 760, H = 210, L = 56, B = 26, T = 12; const mx = Math.max(100, ...porDia) * 1.1; const gw = (W - L - 8) / P; const bw = Math.max(3, gw * .64);
  const y = v => T + (H - T - B) * (1 - v / mx);
  let g = ''; for (let k = 0; k <= 3; k++) { const v = mx * k / 3; g += `<line x1="${L}" x2="${W - 6}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)" ${k ? 'stroke-dasharray="3 4"' : ''}/><text x="${L - 8}" y="${y(v) + 4}" text-anchor="end" font-size="11" fill="var(--ink3)">${k ? brl0(v) : '0'}</text>`; }
  porDia.forEach((v, i) => { const x = L + gw * i + (gw - bw) / 2; const d = fromIso(dias[i]); g += `<rect x="${x}" y="${y(v)}" width="${bw}" height="${y(0) - y(v)}" rx="${Math.min(4, bw / 3)}" fill="var(--t)" ${dias[i] === TODAY ? 'fill-opacity=".45"' : ''}><title>${DOW[d.getDay()]} ${ddmm(d)}: ${brl(v)}</title></rect>`; if (P <= 14 || i % 5 === (P - 1) % 5) g += `<text x="${x + bw / 2}" y="${H - 8}" text-anchor="middle" font-size="10.5" fill="var(--ink3)">${P <= 14 ? DOW[d.getDay()] + ' ' : ''}${ddmm(d)}</text>`; });
  const sv = DB.servicos.map(s => { const l = feitas.filter(r => r.serv === s.id); return { s, n: l.length, v: l.reduce((t, r) => t + r.valor, 0) }; }).filter(x => x.n).sort((a, b) => b.v - a.v); const svMax = Math.max(1, ...sv.map(x => x.v));
  const og = Object.entries(ORIGEM).map(([k, [l]]) => [l, per.filter(r => r.origem === k).length]); const ogMax = Math.max(1, ...og.map(x => x[1]));
  const rg = DB.cfg.regioes.map(x => { const l = feitas.filter(r => r.reg === x.id); return { nome: x.nome, n: l.length, v: l.reduce((t, r) => t + r.valor, 0) }; }).filter(x => x.n).sort((a, b) => b.n - a.n); const rgMax = Math.max(1, ...rg.map(x => x.n));
  /* horários de pico (últimos 30 dias) */
  const base30 = DB.reservas.filter(r => r.data >= iso(addDays(TODAY_D, -29)) && r.data <= TODAY && ATIVO(r));
  const hrs = []; for (let hh = 8; hh < 18; hh++) hrs.push(hh); const ordem = [1, 2, 3, 4, 5, 6, 0];
  const cnt = {}; base30.forEach(r => { const k = fromIso(r.data).getDay() + ':' + Math.floor(toMin(r.ini) / 60); cnt[k] = (cnt[k] || 0) + 1; });
  const hmx = Math.max(1, ...Object.values(cnt));
  const heat = `<div class="heat" style="grid-template-columns:40px repeat(${hrs.length},minmax(0,1fr))"><span></span>${hrs.map(hh => `<span>${hh}h</span>`).join('')}${ordem.map(dw => `<span style="text-align:left">${DOW[dw]}</span>${hrs.map(hh => { const v = cnt[dw + ':' + hh] || 0; return `<i style="background:${v ? `color-mix(in oklab, var(--t) ${Math.round(12 + v / hmx * 88)}%, var(--panel))` : 'var(--sunk)'}" title="${DOW[dw]} ${hh}h: ${plural(v, 'reserva', 'reservas')}"></i>`; }).join('')}`).join('')}</div>`;
  const pico = Object.entries(cnt).sort((a, b) => b[1] - a[1])[0]; const vale = []; ordem.slice(0, 5).forEach(dw => hrs.forEach(hh => { if (!cnt[dw + ':' + hh]) vale.push([dw, hh]); }));
  return pageHead('Relatórios', 'Quanto entrou, o que mais vende, de onde vêm as reservas e para onde as equipes mais vão.', `<div class="seg">${[[7, '7 dias'], [30, '30 dias']].map(([k, l]) => `<button class="${S.relP === k ? 'on' : ''}" data-a="relP" data-k="${k}">${l}</button>`).join('')}</div>${excelBtn}`) +
    strip([['Faturamento', brl(fat), `últimos ${P} dias`, 'up'], ['Carros lavados', feitas.length, `${n1(feitas.length / P)} por dia`], ['Ticket médio', brl(feitas.length ? fat / feitas.length : 0), 'por carro'], ['Reservas pela página', `${per.length ? Math.round(online / per.length * 100) : 0}%`, `${falt} faltas · ${canc} cancelamentos`, falt + canc > per.length * .08 ? 'wa' : '']]) +
    `<div class="card" style="margin-bottom:16px"><div class="hd"><h3>Faturamento por dia</h3><span class="sp"></span><span class="sub">atendimentos concluídos e pagos</span></div><div class="bd chart"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Faturamento por dia">${g}</svg></div></div>
    <div class="cols c-1-1" style="margin-bottom:16px"><div class="card"><div class="hd"><h3>Serviços que mais faturam</h3></div><div>${sv.map(x => `<div class="hb" style="--c:${x.s.cor}"><b>${esc(x.s.nome)}<span class="faint" style="font-weight:400"> · ${x.n}</span></b><div class="bar"><i style="width:${x.v / svMax * 100}%"></i></div><span class="num">${brl0(x.v)}</span></div>`).join('')}</div></div>
      <div class="card"><div class="hd"><h3>De onde vêm as reservas</h3></div><div>${og.map(([l, v]) => `<div class="hb"><b>${l}</b><div class="bar"><i style="width:${v / ogMax * 100}%"></i></div><span class="num">${v} <span class="faint">· ${per.length ? Math.round(v / per.length * 100) : 0}%</span></span></div>`).join('')}</div>
      <div class="note t" style="margin:4px 16px 16px">${ic('sparkles', 's')}<span>Reserva pela página não ocupa ninguém no telefone e chega com placa, serviço e horário certos.</span></div></div></div>
    <div class="cols c-3-2"><div class="card"><div class="hd"><h3>Horários de pico</h3><span class="sub">reservas nos últimos 30 dias</span></div><div class="bd">${heat}
      ${pico ? `<div class="note" style="margin-top:14px">${ic('trending', 's')}<span>Mais cheio: <b>${DOWL[+pico[0].split(':')[0]]} às ${pico[0].split(':')[1]}h</b>. ${vale.length ? `Horários vazios em dia de semana, como ${DOWL[vale[0][0]]} às ${vale[0][1]}h, são bons para uma promoção relâmpago.` : ''}</span></div>` : ''}</div></div>
    <div class="card"><div class="hd"><h3>Atendimentos por região</h3><span class="sub">últimos ${P} dias</span></div><div>${rg.map(x => `<div class="hb"><b>${esc(x.nome)}<span class="faint" style="font-weight:400"> · ${x.n}</span></b><div class="bar"><i style="width:${x.n / rgMax * 100}%"></i></div><span class="num">${brl0(x.v)}</span></div>`).join('') || '<div class="empty"><b>Sem atendimentos no período</b></div>'}</div>
      <div class="note" style="margin:4px 16px 16px">${ic('nav', 's')}<span>Taxas de deslocamento no período: <b>${brl(feitas.reduce((t, r) => t + (r.taxa || 0), 0))}</b>.</span></div></div></div>`;
};
A.relP = el => { S.relP = +el.dataset.k; rerender(); };

  const modelo = v.cor && v.modelo.toLowerCase().includes(v.cor.toLowerCase()) ? v.modelo : `${v.modelo} ${(v.cor || corN).toLowerCase()}`;
  const r = { id: 'r' + (UID++) + TAB.slice(0, 3), cod: codigo(), cli: c.id, nome: c.nome, tel: c.tel, placa, modelo, porte: C.porte, serv: C.serv, adds: [...C.adds], data: C.data, ini: C.ini, dur: o.dur, box: livres[0], base: o.base, valor: o.total, plano: !!o.pl, reg: C.reg, end: endCliente(), local: C.local, agua: C.agua, taxa: o.tx, st: 'agendada', origem: 'online', lavador: null, pago: null, obs: C.obs, criado: Date.now(), visto: false, user: true };
  DB.reservas.push(r); save(); C.done = r.id; C.editou = false; C.step = 'ok'; renderBk();
}
A.bkIcs = () => {
  const r = resById(C.done); if (!r) return; const d = r.data.replace(/-/g, ''); const t0 = r.ini.replace(':', '') + '00'; const t1 = fimDe(r).replace(':', '') + '00';
  const txt = ['BEGIN:VCALENDAR', 'VERSION:2.0', 'PRODID:-//agendamento//PT-BR', 'BEGIN:VEVENT', `UID:${r.cod}-${r.id}@reserva`, `DTSTART:${d}T${t0}`, `DTEND:${d}T${t1}`, `SUMMARY:${servNome(r.serv)} - ${empresa()}`, `LOCATION:${enderecoCompleto(r).replace(/[,;]/g, m => '\\' + m)}`, `DESCRIPTION:Reserva ${r.cod}. ${r.modelo} ${r.placa}. ${brl(r.valor)}`, 'END:VEVENT', 'END:VCALENDAR'].join('\r\n');
  const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([txt], { type: 'text/calendar' })); a.download = `reserva-${r.cod}.ics`; document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 500);
};

/* ============ sincronia entre abas (painel ⇄ página do cliente) ============ */
function syncExterno() {
  const nv = loadDB(); if (!nv || nv.rev === DB.rev || nv.v !== DBV) return;
  const antes = new Map(DB.reservas.map(r => [r.id, r.data + r.ini + r.st]));
  DB = nv; UID = Math.max(UID, ...DB.reservas.map(r => +String(r.id).replace(/\D/g, '').slice(0, 6) || 0)) + 1;
  if (MODE === 'admin') {
    render(true); if (DR) redrawDrawer();
    DB.reservas.filter(r => r.origem === 'online' && (!antes.has(r.id) || antes.get(r.id) !== r.data + r.ini + r.st)).forEach(r => {
      const nova = !antes.has(r.id);
      toast(nova ? `Nova reserva pela página: <b>${esc(r.nome.split(' ')[0])}</b>, ${dataCurta(r.data)} às ${r.ini} · ${esc(servNome(r.serv))}` : r.st === 'cancelada' ? `${esc(r.nome.split(' ')[0])} cancelou a reserva de ${dataCurta(r.data)} às ${r.ini}` : `${esc(r.nome.split(' ')[0])} remarcou para ${dataCurta(r.data)} às ${r.ini}`, { icon: nova ? 'calcheck' : 'calclock', ms: 7000, action: { label: 'Ver', fn: () => openReserva(r.id) } });
    });
  } else {
    const a = document.activeElement; if (a && /INPUT|TEXTAREA|SELECT/.test(a.tagName)) return;
    renderBk();
  }
}
addEventListener('storage', e => { if (e.key === LS_KEY + ':rev') syncExterno(); });
setInterval(() => { const v = lsGet(LS_KEY + ':rev'); if (v && +v.split(':')[0] !== DB.rev) syncExterno(); }, 2000);

/* ============ início ============ */
initDB();
document.body.insertAdjacentHTML('beforeend', '<div id="bk"></div>');
route();

</script>
